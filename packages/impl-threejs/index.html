<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bench • Three.js</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; background: #0d1117; color: #e6edf3; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      #app { display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 12px; }
      #canvas-host canvas { display: block; border: 1px solid #30363d; }
      #hud { font-size: 12px; opacity: 0.8; }
      #hud .phase { color: #79c0ff; }
      #hud .done { color: #56d364; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">Three.js • <span id="phase" class="phase">idle</span> • <span id="fps">— fps</span></div>
      <div id="canvas-host"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
